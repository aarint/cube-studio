[package]
name = "cube-studio"
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
description = "Cube Studio - a multi-middleware GUI for Redis, Memcached, Kafka, RabbitMQ, NATS and MQTT"
authors = ["aarint"]
license = "MIT"

[lib]
name = "cube_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
aes-gcm = "0.11"
sha2 = "0.10"
hmac = "0.12"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rand = "0.10"
bytes = "1"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# ---- middleware drivers -------------------------------------------------
# `ring` keeps the build free of cmake/aws-lc-sys requirements on every
# platform, which matters for a desktop app that must build anywhere.
redis = { version = "1", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
    "cluster-async",
    "streams",
    "script",
    "acl",
    "geospatial",
    "tokio-rustls-comp",
] }
rskafka = { version = "0.6", features = ["compression-gzip", "compression-lz4", "compression-snappy", "compression-zstd", "transport-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
rustls-pemfile = "2"
lapin = { version = "4", default-features = false, features = ["tokio", "rustls--ring"] }
async-nats = { version = "0.51", features = ["ring"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
# Enables the docker-backed integration tests in `tests/integration.rs`.
integration = []
