name: release

# Builds installers for every desktop platform.
#
# Two entry points, because they need different outputs:
#   * pushing a `v*` tag publishes a GitHub release with the installers attached
#   * a manual run (workflow_dispatch) only proves the build works and leaves the
#     artefacts as workflow downloads, so nothing is published by accident
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish as a draft release instead of keeping artefacts only"
        type: boolean
        default: false

# Only one release build at a time; two uploaders on the same tag would race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # One place to change if the runner images move.
  NODE_VERSION: "22"
  RUST_BACKTRACE: "1"

jobs:
  build:
    strategy:
      # A failing platform must not cancel the others: partial artefacts are
      # still worth having, and the summary makes the gap obvious.
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macOS Apple Silicon
          - platform: macos-14
            target: x86_64-apple-darwin
            label: macOS Intel
          - platform: ubuntu-22.04
            target: ""
            label: Linux x86_64
          - platform: windows-latest
            target: ""
            label: Windows x86_64

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Installing every Apple target on the macOS runner lets the one job
          # build either slice; other platforms need no cross target.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target || 'default' }}

      - name: Verify the version manifests agree
        run: node scripts/set-version.mjs --check

      - name: Install frontend dependencies
        run: npm ci

      # ---- tagged release ------------------------------------------------
      - name: Build and attach to the release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cube Studio ${{ github.ref_name }}"
          releaseBody: |
            Cube Studio — a desktop client for Redis, Memcached, Kafka, RabbitMQ,
            NATS and MQTT, with managed-cloud discovery.

            ### Downloads

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Linux | `*.AppImage`, `*.deb` |
            | Windows | `*.msi`, `*_x64-setup.exe` |

            macOS builds are unsigned, so Gatekeeper will ask for confirmation on
            first launch (right-click → Open, or System Settings → Privacy & Security).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # ---- manual dry run ------------------------------------------------
      - name: Build without publishing
        if: github.event_name == 'workflow_dispatch' && !inputs.draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Omitting tagName makes tauri-action build but not touch releases.
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Keep installers as workflow artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target || matrix.platform }}
          # Upload whatever exists; a platform that failed mid-bundle simply
          # produces nothing rather than failing this step too.
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

  # Publishing is irreversible enough that the release is checked rather than
  # assumed: every platform must be represented, and no asset may be empty.
  verify:
    needs: build
    if: github.ref_type == 'tag' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every platform is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Assets upload in parallel; give the API a moment to settle.
          for attempt in 1 2 3 4 5 6; do
            assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | "\(.name) \(.size)"')
            count=$(wc -l <<<"$assets" | tr -d ' ')
            echo "attempt $attempt: $count asset(s)"
            [ "$count" -ge 5 ] && break
            sleep 15
          done

          echo "Attached assets (name + bytes):"
          echo "$assets"

          status=0
          require() {
            local pattern="$1" label="$2"
            if ! grep -qiE "$pattern" <<<"$assets"; then
              echo "::error::missing $label"
              status=1
              return
            fi
            # An asset of 0 bytes means the upload was truncated.
            if grep -iE "$pattern" <<<"$assets" | awk '{ if ($NF < 1024) exit 1 }'; then
              :
            else
              echo "::error::$label looks truncated (under 1 KiB)"
              status=1
            fi
          }

          require 'aarch64.*\.dmg [0-9]+'   "macOS Apple Silicon dmg"
          require 'x64.*\.dmg [0-9]+'       "macOS Intel dmg"
          require '\.AppImage [0-9]+'       "Linux AppImage"
          require '\.deb [0-9]+'            "Linux deb"
          require '(\.msi|setup\.exe) [0-9]+' "Windows installer"

          exit $status
