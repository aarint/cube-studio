<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Cube Studio">
  <title>Cube Studio</title>
  <!-- Body: two faces of an isometric cube. -->
  <polygon points="88,201 256,298 256,438 88,341" fill="#22303f"/>
  <polygon points="424,201 256,298 256,438 424,341" fill="#33475e"/>
  <!-- Interior, revealed where the lid opens. -->
  <polygon points="256,104 424,201 256,298 88,201" fill="#0e141b"/>
  <!-- Lid, inset from the body by a uniform gutter. -->
  <polygon points="256,104 397,185 256,266 115,185" fill="#4c9aff"/>
  <!-- Aperture: the inspection port, cut through the lid. -->
  <circle cx="256" cy="185" r="46" fill="#0e141b"/>
</svg>
